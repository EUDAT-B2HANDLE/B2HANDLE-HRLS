/*
 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */

// plugins
plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'project-report'
    id 'war'
}

// project naming and version. It is build for java 1.8 and higher
group = 'HandleReverseLookupServlet'
version = '1.0.13'
description = 'HandleReverseLookupServlet'
java.sourceCompatibility = JavaVersion.VERSION_1_8

// repositories to get libraries from
repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url = uri('https://mvnrepository.com')
        url = uri('https://repo.maven.apache.org/maven2/')
        url = uri('https://download.oracle.com/maven')
    }
}

// Set resources directories to be src/de directory.
// Gradle excludes *.java files in resource directories by default
sourceSets {
  main {
    java { srcDirs = ["src/de"] }    // the source dirs for the java compiler
  }
}

// dependencies. Versions are assigned in gradle/libs.versions.toml
dependencies {
    implementation(libs.c3p0)
    implementation(libs.commons.logging)
    implementation(libs.jakarta.jws.api)
    implementation(libs.jakarta.xml.bind.api)
    implementation(libs.javax.activation.api)
    implementation(libs.javax.servlet.api)
    implementation(libs.jaxb.api)
    implementation(libs.jersey.server)
    implementation(libs.jersey.container.servlet)
    implementation(libs.jersey.media.json.jackson)
    implementation(libs.jetty.server)
    implementation(libs.log4j.api)
    implementation(libs.log4j.core)
    implementation(libs.log4j.slf4j.impl)
    implementation(libs.log4j.web)
    implementation(libs.mysql.connector.j)
    implementation(libs.osgi.resource.locator)
    implementation(libs.protobuf.java)
    implementation(libs.slf4j.api)
    implementation(libs.solr.solrj)
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

// war file. To build a war file with teh correct web content and remove a duplicate jar
war {
    webInf { from 'WebContent/WEB-INF' } // adds a file-set to the WEB-INF dir.
    rootSpec.exclude("**/javax.inject-1.jar")
}
